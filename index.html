<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday, Shubhi!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #160914;
      --bg-card: #241021;
      --pink: #ff4d8d;
      --pink-soft: #ff8fb8;
      --rose: #e11d48;
      --gold: #fbbf24;
      --cream: #fff7ed;
      --paper: #fffdf7;
      --line: rgba(180, 130, 90, 0.22);
      --text-light: #fff9fc;
      --text-muted: rgba(255, 240, 247, 0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b040a;
      color: var(--text-light);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      max-height: 920px;
      overflow: hidden;
      background: radial-gradient(circle at top, #2c1028 0%, #150813 65%, #0d040c 100%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
    }

    @media (min-width: 500px) {
      .app-shell {
        height: 94dvh;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    /* Top bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      pointer-events: none;
    }

    .top-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(18, 8, 17, 0.58);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .top-btn:active {
      transform: scale(0.95);
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      padding: 0;
      justify-content: center;
      font-size: 16px;
    }

    /* Confetti / Particle Canvas */
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 45;
    }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 22px 28px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(18px) scale(0.985);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    /* Scene 1: Bow & Arrow Pull */
    .scene-bow {
      background: radial-gradient(circle at 50% 42%, #ffdfeb 0%, #f8c6d8 48%, #e8a7be 100%);
      color: #3a1226;
      justify-content: space-between;
      padding-top: 76px;
      padding-bottom: 42px;
      user-select: none;
      touch-action: none;
    }

    .bow-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
      color: #7c2d52;
      margin-top: 8px;
    }

    .heart-target-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }

    .heart-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 64, 129, 0.38) 0%, rgba(255, 64, 129, 0) 70%);
      animation: pulseGlow 2.2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .big-heart-svg {
      width: 136px;
      height: 136px;
      filter: drop-shadow(0 12px 24px rgba(219, 39, 119, 0.35));
      transition: transform 0.25s ease;
    }

    .bow-stage {
      position: relative;
      width: 240px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .bow-stage:active {
      cursor: grabbing;
    }

    .bow-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.12s ease-out;
    }

    .pull-hint {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #832750;
      margin-top: 8px;
    }

    .pull-knob {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(131, 39, 80, 0.45);
      background: rgba(255, 255, 255, 0.75);
      margin-top: 10px;
      animation: bounceDown 1.4s infinite;
    }

    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* Scene 2: Pink Birthday Card */
    .scene-bday-card {
      background: linear-gradient(160deg, #ff3377 0%, #e11d63 52%, #9d174d 100%);
      text-align: center;
      cursor: pointer;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .card-kicker {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
      color: rgba(255, 245, 250, 0.92);
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .card-hero-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(46px, 13vw, 64px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 2;
    }

    .scribble-line {
      width: 170px;
      height: 18px;
      margin: 14px auto;
      position: relative;
      z-index: 2;
    }

    .card-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 17px;
      color: rgba(255, 240, 247, 0.92);
      position: relative;
      z-index: 2;
    }

    .tap-pill {
      margin-top: 34px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      position: relative;
      z-index: 2;
    }

    /* Scene 3: Heart Balloon Tree for Shubhi */
    .scene-tree {
      background: radial-gradient(circle at 50% 25%, #fff0f5 0%, #f9d8e4 55%, #ecc2d3 100%);
      color: #3b1126;
      justify-content: flex-end;
      padding-bottom: 34px;
      cursor: pointer;
    }

    .tree-canvas-box {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }

    .tree-svg {
      width: 310px;
      max-width: 88vw;
      height: auto;
      overflow: visible;
    }

    .tree-caption-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 18px 20px;
      text-align: left;
      box-shadow: 0 14px 36px rgba(136, 19, 55, 0.12);
      z-index: 5;
    }

    .tree-kicker {
      font-size: 13px;
      color: #9d174d;
      font-weight: 600;
    }

    .tree-name-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.12;
      color: #be123c;
      margin: 4px 0 6px;
    }

    .tree-sub {
      font-size: 14px;
      color: #502238;
      margin: 0;
    }

    .continue-subtle {
      text-align: center;
      font-size: 12px;
      color: rgba(80, 34, 56, 0.65);
      margin-top: 12px;
      font-weight: 600;
    }

    /* Scene 4: Cake Scene */
    .scene-cake {
      background: radial-gradient(circle at 50% 30%, #3b1535 0%, #1c0a1b 70%, #110610 100%);
      text-align: center;
      cursor: pointer;
    }

    .cake-heading {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .cake-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .cake-visual {
      position: relative;
      width: 240px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 8px auto 18px;
    }

    .candle {
      width: 10px;
      height: 36px;
      border-radius: 4px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #fb7185 5px, #fb7185 10px);
      position: relative;
      margin-bottom: -2px;
      opacity: 0;
      transform: translateY(-16px);
      transition: all 0.45s ease 0.55s;
    }

    .scene-cake.active .candle {
      opacity: 1;
      transform: translateY(0);
    }

    .flame {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 20px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 50% 70%, #fffbeb 15%, #fbbf24 55%, #f97316 100%);
      box-shadow: 0 0 18px #fbbf24, 0 0 36px #f97316;
      animation: flicker 0.22s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(0.95) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.06) rotate(2deg); }
    }

    .cake-layer-top {
      width: 156px;
      height: 44px;
      border-radius: 14px 14px 6px 6px;
      background: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
      box-shadow: 0 6px 0 #fda4af;
      opacity: 0;
      transform: translateY(-28px);
      transition: all 0.4s ease 0.35s;
      z-index: 3;
    }

    .cake-layer-mid {
      width: 184px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(180deg, #881337 0%, #6b0f2b 100%);
      opacity: 0;
      transform: translateY(-24px);
      transition: all 0.4s ease 0.18s;
      z-index: 2;
    }

    .cake-layer-bot {
      width: 210px;
      height: 52px;
      border-radius: 12px 12px 16px 16px;
      background: linear-gradient(180deg, #581c87 0%, #3b0764 100%);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.4s ease 0.05s;
      z-index: 1;
    }

    .scene-cake.active .cake-layer-bot,
    .scene-cake.active .cake-layer-mid,
    .scene-cake.active .cake-layer-top {
      opacity: 1;
      transform: translateY(0);
    }

    .cake-plate {
      width: 236px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #cbd5e1, #f8fafc, #cbd5e1);
      margin-top: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .cake-wish-banner {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin-top: 8px;
    }

    /* Scene 5: Pop the Balloons */
    .scene-balloons {
      justify-content: flex-start;
      padding-top: 72px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 6px;
    }

    .section-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 14px;
    }

    .balloon-field {
      position: relative;
      width: 100%;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
    }

    .balloon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.25s ease;
      animation: floatBalloon 2.8s ease-in-out infinite;
    }

    .balloon-item:nth-child(2n) {
      animation-delay: 0.7s;
      margin-top: 24px;
    }

    @keyframes floatBalloon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }

    .balloon-item.popped {
      opacity: 0;
      transform: scale(1.35);
      pointer-events: none;
    }

    .balloon-shape {
      width: 52px;
      height: 64px;
      border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
      box-shadow: inset -8px -10px 16px rgba(0, 0, 0, 0.22), 0 8px 18px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .balloon-shape::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 12px;
      width: 10px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      transform: rotate(-22deg);
    }

    .balloon-string {
      width: 1.5px;
      height: 36px;
      background: rgba(255, 255, 255, 0.45);
    }

    .reasons-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 6px;
    }

    .reason-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 11px 14px;
      animation: popInCard 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes popInCard {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .reason-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pink-soft);
      display: block;
      margin-bottom: 3px;
    }

    .reason-text {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .thousand-note {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 15px;
      margin: 14px 0 8px;
    }

    .primary-btn {
      width: 100%;
      padding: 15px 22px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4d8d 0%, #f43f5e 50%, #fb923c 100%);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(244, 63, 94, 0.38);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    /* Scene 6: Memory Lane Polaroid Deck */
    .scene-memories {
      justify-content: space-between;
      padding-top: 72px;
      padding-bottom: 28px;
    }

    .deck-stage {
      position: relative;
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    .polaroid {
      position: absolute;
      width: 256px;
      background: #fffdf9;
      color: #271722;
      padding: 12px 12px 26px;
      border-radius: 6px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      cursor: grab;
      user-select: none;
    }

    .polaroid-tape {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 72px;
      height: 18px;
      background: rgba(251, 191, 36, 0.55);
      border-radius: 2px;
    }

    .polaroid-img-box {
      width: 100%;
      height: 255px;
      border-radius: 3px;
      overflow: hidden;
      background: #f3e8ee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .polaroid-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .polaroid-footer {
      text-align: center;
      margin-top: 10px;
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #5c374c;
    }

    .dots-row {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease;
    }

    .dot.active {
      width: 20px;
      border-radius: 999px;
      background: var(--pink-soft);
    }

    /* Scene 7: Envelope & Letter */
    .scene-letter {
      justify-content: flex-start;
      padding-top: 74px;
      padding-bottom: 34px;
    }

    .envelope-box {
      width: 280px;
      height: 185px;
      margin: 24px auto;
      position: relative;
      border-radius: 16px;
      background: linear-gradient(145deg, #f59e0b 0%, #d97706 60%, #b45309 100%);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.22s ease;
    }

    .envelope-box:hover {
      transform: translateY(-4px);
    }

    .wax-seal {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fb7185, #be123c);
      border: 2px solid rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      margin-bottom: 10px;
    }

    .letter-sheet {
      width: 100%;
      background: var(--paper);
      color: #2b1a24;
      border-radius: 18px;
      padding: 22px 20px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
      background-image: repeating-linear-gradient(
        transparent,
        transparent 29px,
        var(--line) 30px
      );
      display: none;
    }

    .letter-sheet.open {
      display: block;
      animation: popInCard 0.4s ease;
    }

    .letter-salutation {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      font-weight: 700;
      color: #be123c;
      margin-bottom: 8px;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: 23px;
      line-height: 30px;
      color: #2c1824;
      white-space: pre-wrap;
      min-height: 220px;
    }

    .letter-sign {
      margin-top: 16px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      color: #7c2d52;
      font-weight: 600;
    }

    /* Scene 8: Kitty Video Surprise */
    .scene-kitty {
      justify-content: space-between;
      padding-top: 72px;
      padding-bottom: 30px;
      text-align: center;
    }

    .kitty-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 18px;
      margin: 14px 0;
