<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday, Shubhi!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #160914;
      --bg-card: #241021;
      --pink: #ff4d8d;
      --pink-soft: #ff8fb8;
      --rose: #e11d48;
      --gold: #fbbf24;
      --cream: #fff7ed;
      --paper: #fffdf7;
      --line: rgba(180, 130, 90, 0.22);
      --text-light: #fff9fc;
      --text-muted: rgba(255, 240, 247, 0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b040a;
      color: var(--text-light);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      max-height: 920px;
      overflow: hidden;
      background: radial-gradient(circle at top, #3a1932 0%, #160914 100%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 500px) {
      .app-shell {
        height: 94dvh;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
    }
    /*.app-shell styles continue*/
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px;
      pointer-events: none;
    }

    .top-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(18, 17, 24, 0.58);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .top-btn:active {
      transform: scale(0.95);
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 22px 28px;
      opacity: 0;
      visibility: hidden;
      transform: translate(0, 18px) scale(0.985);
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      transform: translate(0) scale(1);
    }

    /* Scene 1: Bow & Arrow Pull */
    .scene-bow {
      background: radial-gradient(circle at 50% 35%, #2a0822 0%, #160914 100%);
      text-align: center;
      cursor: pointer;
      padding-top: 76px;
      padding-bottom: 42px;
      user-select: none;
      touch-action: none;
    }

    .bow-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 18px;
      color: #7c2d52;
      margin-top: 8px;
    }

    .heart-target-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
    }

    .heart-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 77, 141, 0.35) 0%, rgba(255, 77, 141, 0) 70%);
      animation: pulseGlow 2.2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .big-heart-svg {
      width: 136px;
      height: 136px;
      filter: drop-shadow(0 12px 24px rgba(219, 39, 119, 0.4));
      transition: transform 0.25s ease;
    }
        /* Scene 1: Bow & Arrow Assembly */
    .bow-stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
    }

    .bow-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* Scene 2: Heart Tree */
    .scene-tree {
      background: radial-gradient(circle at 50% 40%, #fdcad6 0%, #fbcfe8 100%);
      justify-content: flex-end;
      padding-bottom: 24px;
    }

    .tree-canvas-box {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-top: 12px;
    }

    .tree-svg {
      width: 320px;
      max-width: 90vw;
      height: auto;
      overflow: visible;
    }

    .tree-caption-card {
      width: 100%;
      max-width: 320px;
      padding: 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 36px rgba(136, 19, 55, 0.15);
      text-align: left;
      z-index: 5;
    }

    .tree-name-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.12;
      color: #9f1239;
      margin: 4px 0 6px;
    }

    /* Scene 4: Cake Scene */
    .scene-cake {
      background: radial-gradient(circle at 50% 40%, #fdf2f8 0%, #fce7f3 100%);
      text-align: center;
    }

    .cake-svg {
      width: 240px;
      height: 220px;
    }

    .candle {
      width: 10px;
      height: 36px;
      position: relative;
      background: repeating-linear-gradient(45deg, #fff, #fff 4px, #f43f5e 4px, #f43f5e 8px);
      border-radius: 4px;
    }

    .flame {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 24px;
      background: #fbbf24;
      border-radius: 50% 50% 20% 80% / 50% 50% 20% 80%;
      transform-origin: bottom center;
      animation: flicker 0.25s infinite alternate;
      box-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scaleX(0.9); }
      100% { transform: translateX(-50%) scaleX(1.1) translateY(-2px); }
    }
        <!-- Scene 5: Photo Gallery (Grid) -->
    <div id="galleryScreen" class="screen">
      <div class="top-bar">
        <button type="button" class="top-btn" id="galleryBackBtn">
          <span>&larr;</span> Back
        </button>
      </div>
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 28px; color: var(--pink);">Memory Lane</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-top: 4px;">Moments that make us smile</p>
      </div>
      <div class="gallery-grid">
        <img src="https://ibb.co/HLnr3gpM" alt="Memory 1" loading="lazy">
        <img src="https://i.ibb.co/nQVhcP6R" alt="Memory 2" loading="lazy">
        <img src="https://i.ibb.co/DWbkr62X" alt="Memory 3" loading="lazy">
        <img src="https://i.ibb.co/GFFtJ99m" alt="Memory 4" loading="lazy">
        <img src="https://i.ibb.co/0JJF82J2" alt="Memory 5" loading="lazy">
      </div>
    </div>
       <!-- Scene 3: Heart Balloon Tree for Shubhi -->
    <div id="treeScreen" class="screen">
      <div class="top-bar">
        <button type="button" class="top-btn" id="treePrevBtn">
          <span>&larr;</span> Back
        </button>
        <button type="button" class="top-btn" id="treeNextBtn">
          Next <span>&rarr;</span>
        </button>
      </div>
      <div class="tree-canvas-box">
        <svg class="tree-svg" viewBox="0 0 400 500">
          <!-- Tree trunk -->
          <path d="M180 480 Q180 320 200 240 Q185 220 175 240 Q150 340 150 480 Z" fill="#3b1126"/>
          <path d="M220 480 Q220 320 200 240 Q215 220 225 240 Q250 340 250 480 Z" fill="#581c38"/>
          <!-- Foliage base -->
          <ellipse cx="200" cy="180" rx="140" ry="80" fill="url(#treeGrad)"/>
          <!-- Hanging balloons/hearts -->
          <g id="hangingHearts">
            <path d="M130 140 C130 110 160 80 190 120 C220 80 250 110 250 140 C250 170 190 200 130 140 Z" fill="#e11d48"/>
            <path d="M90 180 C90 150 120 120 150 160 C180 120 210 150 210 180 C210 210 150 240 90 180 Z" fill="#be185d"/>
          </g>
        </svg>
      </div>
      <div class="tree-caption-card">
        <span style="font-size: 14px; color: #9f1239; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">For Shubhi</span>
        <h2 class="tree-name-title">A Little Something, For You</h2>
        <p style="font-size: 15px; line-height: 1.6; color: #4c0519; margin: 0;">Each balloon represents a memory, but my favorite ones are always with you.</p>
      </div>
    </div>

    <!-- Scene 4: Birthday Cake -->
    <div id="cakeScreen" class="screen scene-cake">
      <div class="top-bar">
        <button type="button" class="top-btn" id="cakePrevBtn">
          <span>&larr;</span> Back
        </button>
        <button type="button" class="top-btn" id="cakeNextBtn" style="background: var(--pink); border: none;">
          Final Wish <span>✨</span>
        </button>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
        <div style="margin-bottom: 24px; position: relative;">
          <div class="candle" style="left: 50%; transform: translateX(-50%);">
            <div class="flame"></div>
          </div>
        </div>
        <svg class="cake-svg" viewBox="0 0 300 240">
          <rect x="50" y="140" width="200" height="80" rx="16" fill="#fbcfe8"/>
          <path d="M50 140 Q150 160 250 140 Z" fill="#f43f5e"/>
          <rect x="70" y="80" width="160" height="60" rx="12" fill="#fbcfe8"/>
        </svg>
        <h2 style="font-family: 'Playfair Display', serif; font-size: 32px; color: #881337; margin: 24px 0 8px;">Make a Wish!</h2>
        <p style="font-size: 16px; color: #9f1239; max-width: 280px; margin: 0;">Blow out the candle and let your heart guide the way.</p>
      </div>
    </div>

    <!-- Scene 6: Grand Finale -->
    <div id="finaleScreen" class="screen scene-finale">
      <div class="top-bar" style="justify-content: flex-start;">
        <button type="button" class="top-btn" id="restartBtn">
          <span>&larr;</span> Start Over
        </button>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
        <h1 class="finale-title">Happy Birthday, Shubhi! 🎉</h1>
        <p class="finale-subtitle">May your year be as bright and joyful as your smile.</p>
        <div style="margin-top: 32px; width: 100%; max-width: 360px;">
          <div style="position: relative; width: 100%; padding-top: 56.25%; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); background: #000;">
            <video id="kittyVideo" src="https://assets.mixkit.co/videos/preview/mixkit-little-cat-sitting-on-the-floor-41249-large.mp4" loop playsinline style="position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover;"></video>
            <button id="videoOverlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3); border: none; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span>▶ Play Birthday Message</span>
            </button>
          </div>
        </div>
        <div class="finale-kitty-badge">
          <span style="font-size: 24px;">🐱</span>
          <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); margin-top: 4px;">Authorized by Kitty</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      currentScreen: 0,
      bowPulled: false
    };

    const screens = [
      document.getElementById('bowScreen'),
      document.getElementById('treeScreen'),
      document.getElementById('cakeScreen'),
    ];

    function switchScreen(index) {
      if (index < 0 || index >= screens.length) return;
      screens[state.currentScreen].classList.remove('active');
      state.currentScreen = index;
      screens[state.currentScreen].classList.add('active');
    }

    document.getElementById('bowStage').addEventListener('click', () => {
      if(!state.bowPulled) {
        state.bowPulled = true;
        const arrow = document.getElementById('arrowGroup');
        arrow.style.transform = 'translate(15px, -15px) rotate(-5deg)';
        setTimeout(() => switchScreen(1), 600);
      }
    });

    document.getElementById('treePrevBtn').addEventListener('click', () => switchScreen(0));
    document.getElementById('treeNextBtn').addEventListener('click', () => switchScreen(2));
    document.getElementById('cakePrevBtn').addEventListener('click', () => switchScreen(1));
    document.getElementById('cakeNextBtn').addEventListener('click', () => switchScreen(3));

    const video = document.getElementById('kittyVideo');
    const overlay = document.getElementById('videoOverlay');
    overlay.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
      }
    });
  </script>
</body>
</html>
